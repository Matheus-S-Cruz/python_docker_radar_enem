# Reverse proxy do cenario SEGURO.
# O host so fala com o proxy; o proxy encaminha para o backend pela rede interna,
# usando o nome do servico (DNS do Docker). O backend nao publica porta no host.
server {
    listen 80;

    location / {
        proxy_pass http://backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
    }
}
