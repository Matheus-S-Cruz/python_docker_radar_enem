# Aula 9 — PostgreSQL com volume persistente (Mini Radar ENEM)
#
# Alternativa declarativa e reproduzível aos comandos "docker run" do README.
# Equivale aos passos 2 (criar volume) e 3 (iniciar o PostgreSQL).
#
#   docker compose up -d        # sobe o banco em segundo plano
#   docker compose ps           # verifica o status
#   docker compose logs db      # consulta os logs
#   docker compose exec db psql -U radar -d radar   # abre o cliente SQL
#
# ⚠️ Credenciais APENAS para laboratório. Nunca use em produção.

services:
  db:
    image: postgres:16
    container_name: radar-db
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar_lab_123
      POSTGRES_DB: radar
    ports:
      - "5432:5432"
    volumes:
      # Volume NOMEADO: garante a persistência dos dados entre recriações do container.
      - radar-db-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  # Declarar o volume aqui faz o Compose reutilizar "radar-db-dados" (mesmo nome do README).
  radar-db-dados:
    name: radar-db-dados