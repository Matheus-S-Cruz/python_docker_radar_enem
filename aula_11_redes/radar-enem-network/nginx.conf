server {
    listen 80;

    location / {
        # O Nginx resolve o nome do container "radar-backend" atraves da rede frontend-net.
        proxy_pass http://radar-backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header X-Proxy-Layer "frontend-net-dmz";

        # Timeouts curtos: no Desafio 3 (queda da rota publica do backend) o proxy
        # falha rapido com erro de gateway em vez de esperar ~60s pelo timeout padrao.
        proxy_connect_timeout 3s;
        proxy_send_timeout 3s;
        proxy_read_timeout 3s;
    }
}
