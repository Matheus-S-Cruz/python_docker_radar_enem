<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
    <marker id="arrowBlocked" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,10 M10,2 L2,10" stroke="#d9534f" stroke-width="2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="760" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0b2e6b">Arquitetura de Rede em Nuvem — Radar ENEM (Incremento 4)</text>
  <text x="480" y="58" text-anchor="middle" font-size="14" fill="#555">VPC 10.20.0.0/16</text>

  <!-- Usuarios -->
  <rect x="60" y="86" width="180" height="56" rx="8" fill="#f3f3f3" stroke="#888"/>
  <text x="150" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#333">Usuários / Estudantes</text>
  <text x="150" y="128" text-anchor="middle" font-size="12" fill="#555">HTTPS (443)</text>

  <!-- Internet -->
  <ellipse cx="480" cy="114" rx="90" ry="38" fill="#f3f3f3" stroke="#888"/>
  <text x="480" y="119" text-anchor="middle" font-size="15" font-weight="700" fill="#333">Internet</text>

  <!-- VPC box -->
  <rect x="40" y="180" width="880" height="540" rx="12" fill="#fafbfe" stroke="#2f6fed" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="58" y="204" font-size="14" font-weight="700" fill="#0b2e6b">VPC Radar ENEM — 10.20.0.0/16</text>

  <!-- Sub-rede Publica -->
  <rect x="70" y="220" width="820" height="150" rx="10" fill="#e7f0ff" stroke="#2f6fed"/>
  <text x="86" y="242" font-size="14" font-weight="700" fill="#0b2e6b">Sub-rede PÚBLICA — 10.20.1.0/24</text>
  <rect x="110" y="258" width="190" height="86" rx="8" fill="#ffffff" stroke="#2f6fed"/>
  <text x="205" y="296" text-anchor="middle" font-size="14" font-weight="600" fill="#0b2e6b">Internet Gateway</text>
  <text x="205" y="316" text-anchor="middle" font-size="13" fill="#0b2e6b">(IGW)</text>
  <rect x="385" y="258" width="190" height="86" rx="8" fill="#ffffff" stroke="#2f6fed"/>
  <text x="480" y="296" text-anchor="middle" font-size="14" font-weight="600" fill="#0b2e6b">Load Balancer /</text>
  <text x="480" y="316" text-anchor="middle" font-size="13" fill="#0b2e6b">Reverse Proxy</text>
  <rect x="660" y="258" width="190" height="86" rx="8" fill="#ffffff" stroke="#2f6fed"/>
  <text x="755" y="305" text-anchor="middle" font-size="14" font-weight="600" fill="#0b2e6b">NAT Gateway</text>

  <!-- Sub-rede Privada App -->
  <rect x="70" y="400" width="820" height="130" rx="10" fill="#eafaf0" stroke="#1e9e5a"/>
  <text x="86" y="422" font-size="14" font-weight="700" fill="#0b4a28">Sub-rede PRIVADA (App) — 10.20.2.0/24 — saída via NAT</text>
  <rect x="385" y="438" width="190" height="76" rx="8" fill="#ffffff" stroke="#1e9e5a"/>
  <text x="480" y="470" text-anchor="middle" font-size="14" font-weight="600" fill="#0b4a28">Backend Radar ENEM</text>
  <text x="480" y="490" text-anchor="middle" font-size="12" fill="#0b4a28">API + motor estatístico</text>

  <!-- Sub-rede Privada DB -->
  <rect x="70" y="560" width="820" height="130" rx="10" fill="#fdecec" stroke="#d9534f"/>
  <text x="86" y="582" font-size="14" font-weight="700" fill="#7a1c1a">Sub-rede PRIVADA ISOLADA (DB) — 10.20.3.0/24 — sem rota 0.0.0.0/0</text>
  <rect x="385" y="598" width="190" height="76" rx="8" fill="#ffffff" stroke="#d9534f"/>
  <text x="480" y="630" text-anchor="middle" font-size="14" font-weight="600" fill="#7a1c1a">PostgreSQL</text>
  <text x="480" y="650" text-anchor="middle" font-size="12" fill="#7a1c1a">Microdados do ENEM</text>

  <!-- Setas -->
  <!-- usuarios -> internet -->
  <line x1="240" y1="114" x2="386" y2="114" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- internet <-> IGW -->
  <line x1="470" y1="152" x2="300" y2="256" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="205" font-size="11" fill="#333">ingress/egress</text>
  <!-- IGW -> LB -->
  <line x1="300" y1="301" x2="383" y2="301" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- LB -> Backend -->
  <line x1="480" y1="344" x2="480" y2="436" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="492" y="392" font-size="11" fill="#333">encaminha requisições</text>
  <!-- Backend -> PG -->
  <line x1="480" y1="514" x2="480" y2="596" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="492" y="552" font-size="11" fill="#333">SQL 5432 (interno à VPC)</text>
  <!-- Backend -> NAT (egress) -->
  <path d="M575,476 C660,476 720,420 745,346" fill="none" stroke="#1e9e5a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="660" y="440" font-size="11" fill="#1e9e5a">egress (updates / INEP)</text>
  <!-- NAT -> Internet -->
  <path d="M755,258 C755,200 620,150 560,126" fill="none" stroke="#1e9e5a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="640" y="190" font-size="11" fill="#1e9e5a">tradução p/ IP público</text>
  <!-- PG bloqueado p/ internet -->
  <line x1="885" y1="625" x2="885" y2="150" stroke="#d9534f" stroke-width="2" stroke-dasharray="3 5" marker-end="url(#arrowBlocked)"/>
  <text x="900" y="400" font-size="11" fill="#d9534f" transform="rotate(90 900,400)">sem caminho p/ internet</text>

  <!-- Legenda -->
  <rect x="70" y="702" width="14" height="14" fill="#333"/><text x="90" y="714" font-size="11" fill="#333">tráfego permitido</text>
  <line x1="220" y1="709" x2="240" y2="709" stroke="#1e9e5a" stroke-width="2" stroke-dasharray="6 4"/><text x="246" y="714" font-size="11" fill="#1e9e5a">saída via NAT (egress)</text>
  <line x1="400" y1="709" x2="420" y2="709" stroke="#d9534f" stroke-width="2" stroke-dasharray="3 5"/><text x="426" y="714" font-size="11" fill="#d9534f">bloqueado (isolamento do DB)</text>
</svg>
