services:
  radar-enem:
    build: .
    image: radar-enem:${VERSAO:-v2}
    container_name: radar-enem
    ports:
      - "5000:5000"
    environment:
      AMBIENTE: ${AMBIENTE:-producao}
      REGIAO: ${REGIAO:-Brasil}
      VERSAO: ${VERSAO:-v2}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
